# ---------------------------------------------------------------------------
# Frontend server: serves the SPA and proxies /api to the backend container.
#
# One origin for both is a security decision, not a deployment convenience. It
# lets the API set a same-site HttpOnly session cookie that the browser attaches
# automatically, which means no token is ever readable by JavaScript — and it
# removes CORS from the picture entirely, so there is no allow-list to get
# wrong.
#
# Every location includes security-headers.conf rather than inheriting it; see
# the explanation at the top of that file for why that repetition is necessary.
#
# The app is served both at the root and under a path prefix (the Cloudflare
# tunnel routes jimajer.cz/carPosFE/* here and forwards the prefix verbatim —
# tunnels cannot strip it). Both work at once and neither is configured into the
# build: requests arriving with the prefix have it stripped here, and the
# index.html they get back is rewritten to declare that prefix as its <base>, so
# the browser then asks for every asset and every /api call under it.
# ---------------------------------------------------------------------------

# The <base href> written into index.html for this particular request, decided by
# the prefix it arrived under. $request_uri is the URI as the client sent it —
# before the rewrite below strips the prefix — which is exactly what makes this
# work from inside the un-prefixed locations.
#
# This file is rendered into conf.d/, which the stock nginx.conf includes in the
# http context, so a map here is in the right place.
map $request_uri $carpos_base_href {
    # Reached at the site root: relative URLs resolve against "/" and the app
    # behaves exactly as it did before any of this existed.
    default "/";

    # Reached through the prefix: every relative URL on the page must carry it.
    # Substituted at start-up from CARPOS_BASE_PATH by docker-entrypoint.sh —
    # when that is empty the entrypoint writes a sentinel path no client would
    # ever request, which disables the prefix handling without a second template.
    # A character class rather than an escaped '?', so nothing here depends on
    # how nginx unescapes a quoted string. $request_uri carries the query, hence
    # the '?' alternative alongside '/' and end-of-string.
    "~^__CARPOS_BASE_PATH__([/?]|$)" "__CARPOS_BASE_PATH__/";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version in every response.
    server_tokens off;

    # Requests are JSON bodies at most a few kilobytes — the device-create call
    # with a long share list is the largest. A low cap costs nothing and bounds
    # what a single request can make the API buffer.
    client_max_body_size 256k;

    # ---- Path-prefix entry point ------------------------------------------
    # Everything below this pair is written as though the prefix did not exist.
    # These two are the only places that know about it.

    # The bare prefix with no trailing slash: send the browser to the slashed
    # form so the <base href> it then receives has something to be relative to.
    # $is_args$args keeps a query string that would otherwise be dropped.
    location = __CARPOS_BASE_PATH__ {
        include /etc/nginx/carpos-security-headers.conf;

        return 301 __CARPOS_BASE_PATH__/$is_args$args;
    }

    # Strip the prefix and restart location matching, so /api/, /assets/,
    # /config.js and the SPA fallback are each reached by exactly one code path
    # whether or not the request carried a prefix. `last` re-enters the location
    # search with the rewritten URI while leaving $request_uri — and therefore
    # the base-href decision above — on the original.
    location ^~ __CARPOS_BASE_PATH__/ {
        rewrite ^__CARPOS_BASE_PATH__/(.*)$ /$1 last;
    }

    # ---- API proxy --------------------------------------------------------
    location /api/ {
        include /etc/nginx/carpos-security-headers.conf;

        # Substituted at container start-up by docker-entrypoint.sh from
        # CARPOS_BE_URL, so the backend address lives in the deployment's .env
        # instead of being baked into this file. This file is the template; the
        # generated copy is what nginx actually reads.
        #
        # The substituted value carries no trailing slash and no path, and that
        # matters: give proxy_pass a URI part and nginx *replaces* the matched
        # /api/ prefix rather than passing the path through, so every backend
        # route would 404. The entrypoint strips a trailing slash for that reason.
        proxy_pass __CARPOS_BE_URL__;
        proxy_http_version 1.1;

        # The API trusts these (UseForwardedHeaders in Program.cs) for its
        # rate-limiting partitions and generated URLs, so they are set here
        # rather than passed through from the client.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for the RSA-3072 key generation a device registration
        # performs, short enough that a stuck backend does not pile up
        # connections here.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # API responses are per-session data; no intermediary may cache them.
        add_header Cache-Control "no-store" always;
    }

    # /health and /openapi exist on the API but are deliberately NOT proxied.
    # Liveness detail and a full endpoint description are for the operator, not
    # the internet; reach them from inside the compose network.

    # ---- Static assets ----------------------------------------------------
    # Vite fingerprints these filenames, so a changed file is a changed URL and
    # a year-long immutable cache is safe.
    location /assets/ {
        include /etc/nginx/carpos-security-headers.conf;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # The two responses that must never be cached: index.html points at the
    # current asset hashes and carries the per-request <base href>, and config.js
    # is generated from this deployment's Maps key.
    location = /index.html {
        include /etc/nginx/carpos-security-headers.conf;
        add_header Cache-Control "no-store" always;

        # Point the page at the prefix it was requested through. At the root this
        # substitutes the string for itself and the bytes are unchanged; behind
        # the tunnel it becomes <base href="/carPosFE/" /> and every relative
        # asset, /config.js and API call follows automatically.
        #
        # Rewriting here rather than in the SPA is deliberate: the prefix has to
        # be known before the bundle is fetched, and only the server knows it.
        # This is also why index.html must never be cached — see above.
        #
        # The search string must match the tag in index.html byte for byte —
        # sub_filter is a plain string match, and a silent miss here looks like
        # "the app 404s behind the tunnel" rather than like a config error. Vite
        # copies the tag through untouched, so keep the two spellings in step.
        sub_filter '<base href="/" />' '<base href="$carpos_base_href" />';
        sub_filter_once on;
    }

    # Generated by nginx itself rather than written to disk at start-up.
    #
    # It used to be a file the entrypoint wrote. That put the app's config behind
    # a step that could fail *after* this server config had already been
    # rendered, and because the stock nginx image starts the server even when a
    # /docker-entrypoint.d/ script exits non-zero, the result was a container
    # that served the whole app perfectly with /config.js missing — a 404 in the
    # console and a map that silently never loaded. Answering from here makes
    # that state unreachable: if the key was not substituted this config does not
    # parse, and nginx does not start at all.
    #
    # default_type is mandatory, not cosmetic: we send X-Content-Type-Options
    # nosniff, so a script served as the default text/plain is refused outright.
    #
    # The key is safe to interpolate because docker-entrypoint.sh strips every
    # character that could break out of the JS string literal — including '$',
    # which nginx would otherwise read as the start of one of its variables. It
    # is one line because nginx does not translate '\n' in a returned string; a
    # literal one would put the whole statement behind a '//' comment.
    location = /config.js {
        include /etc/nginx/carpos-security-headers.conf;

        default_type application/javascript;
        add_header Cache-Control "no-store" always;

        return 200 'window.__CARPOS_CONFIG__ = { googleMapsApiKey: "__CARPOS_MAPS_KEY__" };';
    }

    # ---- SPA fallback -----------------------------------------------------
    # Client-side routing means /device/GNSS01/positions is not a file on disk.
    # Serve index.html for anything unmatched so a deep link or a reload works.
    location / {
        include /etc/nginx/carpos-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
