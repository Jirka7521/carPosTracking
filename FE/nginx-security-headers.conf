# ---------------------------------------------------------------------------
# Security response headers, included by every location in nginx.conf.
#
# Why an include rather than one block at server level: nginx's add_header does
# not merge. The moment a location adds a single header of its own, it stops
# inheriting *all* of the server's — so a Cache-Control on the API proxy would
# silently strip the CSP from every API response. Repeating them through this
# file is the only way to be sure they are actually present everywhere.
#
# `always` so they appear on error responses too, not just 2xx.
# ---------------------------------------------------------------------------

# Once a browser has seen this it refuses plain HTTP to this host for a year.
# Only meaningful because TLS terminates in front of this server — remove it if
# you ever serve this origin over HTTP on purpose.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

# Content-Security-Policy. The app is self-contained apart from Google Maps,
# which needs:
#   script-src  maps.googleapis.com — the Maps JS API itself
#   img-src     *.googleapis.com / *.gstatic.com / data: — map tiles and pins
#   connect-src maps.googleapis.com — tile and geocoding XHRs
#
# 'unsafe-inline' in style-src is the one deliberate relaxation: the Maps
# library injects inline styles for its own controls and cannot be made to stop.
# Our own code adds none — the map info window is styled through App.css
# precisely so this stays the only exception. Note that script-src has no
# 'unsafe-inline', which is the half that actually matters for XSS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://maps.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
