services:
  postgres:
    # PostgreSQL 18 + PostGIS 3.6. The official postgis/postgis image is amd64-only,
    # so we use imresamu/postgis, the project's multi-arch mirror with native arm64.
    # Pinned by digest as well as tag, so a re-pull fetches the reviewed bytes.
    image: imresamu/postgis:18-3.6@sha256:b5766ee720aca09c61b9a868abefbf273348a4b90ad4cf146b4f8c9ac85d48e4
    container_name: carpos-postgres
    restart: unless-stopped
    # Bounded logs. The default json-file driver never rotates, and these logs
    # carry personal data: the broker records "client connected from <IP>" for
    # every device and the reverse proxy logs client IPs. An unbounded log is an
    # unbounded retention period for exactly the data nobody meant to keep. See
    # docs/PRIVACY.md.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # admin is the bootstrap superuser / owner the image creates. Its password
      # is a file (see `secrets:` below), read by the image's own entrypoint via
      # the _FILE convention: Docker keeps a container's environment in plain text
      # in its config on the host and prints it in `docker inspect`. Both
      # passwords are only read when an EMPTY data directory is initialised.
      POSTGRES_USER: ${ADMIN_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/ADMIN_PASSWORD
      POSTGRES_DB: ${POSTGRES_DB}
      # BE (read/write, no DDL) is created by initdb/02-create-users.sh, which
      # reads BE_PASSWORD_FILE the same way.
      BE_USER: ${BE_USER}
      BE_PASSWORD_FILE: /run/secrets/BE_PASSWORD
      # Keep the data dir in a subfolder so the volume mount root stays clean.
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - ADMIN_PASSWORD
      - BE_PASSWORD
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, only on first init of an empty data dir.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      MQTTpublic:
        # Pinned: MQTTpublic is macvlan, so this is a real LAN address rather than an
        # internal one. Without the pin the database lands wherever IPAM had a slot
        # free when it started, which after a reboot is whoever won the race.
        # The subnet belongs to the network itself (see the MQTTBroker README).
        ipv4_address: 192.168.124.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:

# Passwords, one file each in ./secrets (gitignored). A file secret without Swarm
# is a plain bind mount with the host file's owner and mode, and the image reads
# them as the postgres user, so the files must be 0644 inside a 0700 directory:
#   chmod 700 secrets && chmod 644 secrets/*
secrets:
  ADMIN_PASSWORD:
    file: ./secrets/ADMIN_PASSWORD
  BE_PASSWORD:
    file: ./secrets/BE_PASSWORD

networks:
  # Shared network created by the Mosquitto broker stack; joined, not created here.
  MQTTpublic:
    external: true