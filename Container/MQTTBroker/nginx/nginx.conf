worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
	worker_connections 1024;
}

http {
	access_log /dev/stdout;
	error_log  /dev/stderr warn;
	server_tokens off;

	# WebSocket upgrade: pass "Connection: upgrade" through only when the client
	# actually asked for it, otherwise close the hop-by-hop header.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# The real client address. Every public connection arrives from the Cloudflare
	# tunnel connector (cloudflared, 192.168.122.50), which puts the visitor's
	# address in CF-Connecting-IP - a header a visitor cannot set. Believed from that
	# peer only. After this $remote_addr is the visitor, which is what the limits
	# below key on; without it every internet client would share cloudflared's one
	# budget and the first noisy one would lock out the trackers.
	set_real_ip_from 192.168.122.50;
	real_ip_header   CF-Connecting-IP;

	# Per-client caps on the public WebSocket entrance. Mosquitto's own
	# max_connections (100) is per listener for everybody together; these stop one
	# address from taking all of it. A tracker holds one connection and reconnects
	# a few times an hour, so ten concurrent connections and thirty upgrades a
	# minute (bursts of ten) leave a lot of room for a flaky mobile link and very
	# little for a flood. 1 MB of zone is ~16,000 addresses.
	limit_conn_zone $binary_remote_addr zone=mqtt_conn_per_ip:1m;
	limit_req_zone  $binary_remote_addr zone=mqtt_upgrade_per_ip:1m rate=30r/m;
	limit_conn_status 429;
	limit_req_status  429;

	server {
		# Cloudflare terminates TLS, so the tunnel hands us plain HTTP here.
		listen 80;
		server_name _;

		location /mqttBroker {
			# Trailing slash strips the /mqttBroker prefix: Mosquitto's WebSocket
			# listener expects the request at the root path.
			proxy_pass http://mqtt.local:9001/;

			limit_conn mqtt_conn_per_ip 10;
			limit_req  zone=mqtt_upgrade_per_ip burst=10 nodelay;

			proxy_http_version 1.1;
			proxy_set_header Upgrade    $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host       $host;
			proxy_set_header X-Real-IP  $remote_addr;
			# Set, not appended: one entry, the real-ip-resolved client.
			proxy_set_header X-Forwarded-For   $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;

			# MQTT connections idle between keepalives; the default 60s read timeout
			# would tear them down mid-session.
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
			proxy_buffering off;
		}

		location = /healthz {
			add_header Content-Type text/plain;
			return 200 "ok\n";
		}

		location / {
			return 404;
		}
	}
}
