worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
	worker_connections 1024;
}

http {
	access_log /dev/stdout;
	error_log  /dev/stderr warn;

	# WebSocket upgrade: pass "Connection: upgrade" through only when the client
	# actually asked for it, otherwise close the hop-by-hop header.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	server {
		# Cloudflare terminates TLS, so the tunnel hands us plain HTTP here.
		listen 80;
		server_name _;

		location /mqttBroker {
			# Trailing slash strips the /mqttBroker prefix: Mosquitto's WebSocket
			# listener expects the request at the root path.
			proxy_pass http://mqtt.local:9001/;

			proxy_http_version 1.1;
			proxy_set_header Upgrade    $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host       $host;
			proxy_set_header X-Real-IP  $remote_addr;
			proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			# MQTT connections idle between keepalives; the default 60s read timeout
			# would tear them down mid-session.
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
			proxy_buffering off;
		}

		location = /healthz {
			add_header Content-Type text/plain;
			return 200 "ok\n";
		}

		location / {
			return 404;
		}
	}
}
