# Mosquitto 2.1 - carPosTracking broker.
#
# Authentication is per listener (per_listener_settings true), because the two
# listeners face different worlds:
#   1883  plain MQTT on the container network - the API, the healthcheck, LAN
#         clients. Never routed through nginx or the tunnel.
#   9001  WebSocket, reached from the internet: Cloudflare -> cloudflared ->
#         nginx -> here.
# Each has its own password file, built by entrypoint-passwd.sh. The WebSocket one
# holds only the accounts that genuinely connect from outside (the trackers, and
# the API's account only if DASHBOARD_ON_WEBSOCKETS is true - off by default), so
# the admin account with `readwrite #` - and the healthcheck - cannot even log in
# from the internet.
#
# per_listener_settings is deprecated in 2.1 in favour of per-listener plugin
# configuration, and is planned for removal in 3.0; it still works throughout 2.x,
# and nothing else in 2.1 restricts a password file to one listener.
per_listener_settings true

# --- listeners ------------------------------------------------------------- #
# Every listener repeats the auth block: with per_listener_settings true an
# option set outside a listener does not reach it. listener_allow_anonymous is the
# 2.1 spelling (2.1 warns about plain allow_anonymous under per_listener_settings);
# without it a listener would fall back to the global default.
#
# Do NOT set `allow_zero_length_clientid false` on either. mosquitto_pub/_sub send
# an empty client id by default and let the broker assign one, so that setting
# makes the healthcheck (and any client that does the same) fail at CONNECT with
# "Client <unknown> disconnected due to protocol error". It buys nothing for
# authorization either: such clients still authenticate and are still ACL'd.

# Plain MQTT: the API container (mqtt://mqtt.local:1883), the healthcheck, LAN
# clients. Every account may log in here.
listener 1883
protocol mqtt
# Cap per listener, so a flood of connections cannot exhaust the broker.
max_connections 100
listener_allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

# WebSocket: reached only from nginx, which the Cloudflare tunnel feeds. Not
# published to the host - see docker-compose.yml. Its own, smaller password file.
listener 9001
protocol websockets
max_connections 100
listener_allow_anonymous false
password_file /mosquitto/secrets/passwd-ws
acl_file /mosquitto/config/acl

# --- persistence ----------------------------------------------------------- #
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# --- logging --------------------------------------------------------------- #
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- limits ---------------------------------------------------------------- #
max_keepalive 120
# Set explicitly: 2.1 lowered the default from the MQTT maximum (256 MB) to
# 2,000,000 bytes, and this is lower still. The largest message here is a device's
# sealed batch of fixes, a few kilobytes.
max_packet_size 65536
