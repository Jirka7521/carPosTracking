# Mosquitto 2.0 - carPosTracking broker.
# Auth settings are global (per_listener_settings false) so the same accounts and
# ACLs apply to both the TCP and the WebSocket listener.
per_listener_settings false

# --- auth ------------------------------------------------------------------ #
# No credentials, no connection: anonymous clients are rejected at CONNECT, and
# every authenticated client is then held to the per-user rules in the ACL, where
# anything not explicitly granted is denied.
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl
# Do NOT set `allow_zero_length_clientid false` here. mosquitto_pub/_sub send an
# empty client id by default and let the broker assign one, so that setting makes
# the healthcheck (and any client that does the same) fail at CONNECT with
# "Client <unknown> disconnected due to protocol error". It buys nothing for
# authorization either: such clients still authenticate and are still ACL'd.

# --- listeners ------------------------------------------------------------- #
# Plain MQTT: LAN clients (ESP32) and the API container.
listener 1883
protocol mqtt

# WebSocket: reached only from nginx, which the Cloudflare tunnel feeds.
# Not published to the host - see docker-compose.yml.
listener 9001
protocol websockets

# --- persistence ----------------------------------------------------------- #
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# --- logging --------------------------------------------------------------- #
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- limits ---------------------------------------------------------------- #
max_keepalive 120
# 2.0 renamed message_size_limit; the old name still works but logs a notice.
max_packet_size 65536
