services:
  mosquitto:
    # eclipse-mosquitto is multi-arch; the arm64 variant runs natively on the Pi.
    # Every image here is pinned by digest as well as tag, so a re-pull fetches the
    # reviewed bytes; Dependabot proposes the bumps (.github/dependabot.yml).
    #
    # 2.1 notes, checked against this config: max_packet_size is set explicitly
    # (2.1's new 2 MB default is not relied on); no TLS client or bridge, so the
    # new OpenSSL hostname verification does not apply; the config, ACL and
    # password files are regular copies made by the entrypoint, never symlinks, so
    # the 2.1 symlink refusal needs no MOSQUITTO_UNSAFE_ALLOW_SYMLINKS.
    image: eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    container_name: carpos-mosquitto
    restart: unless-stopped
    # Bounded logs. The default json-file driver never rotates, and these logs
    # carry personal data: the broker records "client connected from <IP>" for
    # every device and the reverse proxy logs client IPs. An unbounded log is an
    # unbounded retention period for exactly the data nobody meant to keep. See
    # docs/PRIVACY.md.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Invoked via sh so it does not depend on the exec bit surviving the checkout.
    # Rebuilds the password file from .env on every boot, then hands over to the
    # image's own entrypoint. Keeps credentials in .env only, never on disk in git.
    entrypoint: ["/bin/sh", "/config-src/entrypoint-passwd.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    labels:
      # Watched by the autoheal sidecar: unhealthy -> restarted. Docker's own
      # restart policy only reacts to a container *exiting*, never to an unhealthy
      # one that is still running.
      autoheal: "true"
    environment:
      # All four are mandatory - the entrypoint aborts the boot if any is empty,
      # rather than starting a broker with an account nobody can log into.
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      DEVICE_USER: ${DEVICE_USER:?set DEVICE_USER in .env}
      DEVICE_PASSWORD: ${DEVICE_PASSWORD:?set DEVICE_PASSWORD in .env}
      DASHBOARD_USER: ${DASHBOARD_USER:?set DASHBOARD_USER in .env}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      # The probe's account. The entrypoint writes it into an options file that
      # healthcheck.sh hands to mosquitto_pub/_sub, so it is never an argument.
      HEALTHCHECK_USER: ${HEALTHCHECK_USER:?set HEALTHCHECK_USER in .env}
      HEALTHCHECK_PASSWORD: ${HEALTHCHECK_PASSWORD:?set HEALTHCHECK_PASSWORD in .env}
      # Whether the API's dashboard account may also log in over the public
      # WebSocket listener. true keeps an API still configured for
      # ws://mqtt.local:9001 working; once its MQTT_BROKER_URI is
      # mqtt://mqtt.local:1883, set false and that account is internal-only.
      DASHBOARD_ON_WEBSOCKETS: ${DASHBOARD_ON_WEBSOCKETS:-true}
    ports:
      # Plain MQTT for LAN clients (the ESP32) and local tests. The WebSocket
      # listener (9001) is deliberately NOT published: it is reached only through
      # nginx, which is what the Cloudflare tunnel talks to.
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      # Mounted at /config-src, NOT onto /mosquitto/config: the entrypoint copies
      # these in and fixes ownership, which is impossible on a read-only mount and
      # is what Mosquitto's "world readable / owner is not mosquitto" warnings and
      # the image's own `chown -R /mosquitto` errors were both complaining about.
      - ./mosquitto:/config-src:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_secrets:/mosquitto/secrets
    networks:
      MQTTpublic:
        # Pinned, because MQTTpublic is macvlan: this is a real address on the LAN,
        # not an internal one, and without the pin it is whatever IPAM had free when
        # this container happened to start - which after a reboot is a lottery.
        # The subnet itself belongs to the network (see README), never to compose.
        ipv4_address: 192.168.124.2
        aliases:
          # nginx.conf proxies to mqtt.local, which is mDNS on the LAN and does not
          # resolve inside a container. This alias makes the name resolve to this
          # service on the Docker network, so the proxy config works either way.
          - mqtt.local
    healthcheck:
      # Authenticated publish/subscribe round-trip. See healthcheck.sh.
      test: ["CMD", "/bin/sh", "/config-src/healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15s
    # Least privilege. The entrypoint rebuilds the password file as root and
    # hands the files to the mosquitto user, then mosquitto drops to that user:
    # that is all these five capabilities are for.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    # A broker is one process; the headroom is for the healthcheck's clients.
    pids_limit: 64
    deploy:
      resources:
        limits:
          memory: 128m

  nginx:
    # Terminates the plain-HTTP side of the Cloudflare tunnel and upgrades
    # /mqttBroker to a WebSocket connection against the broker's 9001 listener.
    # 1.30 is the stable branch; 1.27 (mainline) has been end of life since
    # 2025-06 and gets no security fixes.
    image: nginx:1.30-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: carpos-mqtt-nginx
    restart: unless-stopped
    # Bounded logs. The default json-file driver never rotates, and these logs
    # carry personal data: the broker records "client connected from <IP>" for
    # every device and the reverse proxy logs client IPs. An unbounded log is an
    # unbounded retention period for exactly the data nobody meant to keep. See
    # docs/PRIVACY.md.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mosquitto:
        # Do not start the proxy until the broker passes its healthcheck. nginx in
        # front of a dead broker just turns the outage into 502s - and it refuses to
        # start at all if it cannot resolve its upstream name.
        condition: service_healthy
        # If the broker gets restarted (by autoheal or by hand), restart nginx too,
        # so it never holds connections to a container that has gone away.
        restart: true
    labels:
      autoheal: "true"
    ports:
      # Only needed when cloudflared runs on the host rather than as a container
      # on MQTTpublic. Bound to loopback so the proxy is never exposed on the LAN.
      - "127.0.0.1:${NGINX_PORT:-8083}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      MQTTpublic:
        # Same reasoning as the broker above: a fixed LAN address, so a reboot
        # cannot shuffle it with whatever else joins the network.
        ipv4_address: 192.168.124.3
    healthcheck:
      # Proves nginx serves AND that its upstream is reachable - a bare /healthz
      # would still pass with a dead broker behind it.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null && nc -z mqtt.local 9001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # The master process binds :80 and then drops to the nginx user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    # A master plus one worker per core.
    pids_limit: 64
    deploy:
      resources:
        limits:
          memory: 64m

  autoheal:
    # Watches container health and restarts anything labelled autoheal=true that has
    # gone unhealthy. Docker Engine has no built-in "restart when unhealthy".
    #
    # Opt-in (`docker compose --profile autoheal up -d`). It watches the whole
    # host, not just this stack, so there must be exactly one per host: on
    # dormServer0 that is temp-autoheal from the temperatureSensor stack, and a
    # second copy here restarted every unhealthy container twice. Enable it only
    # on a host where nothing else runs autoheal.
    profiles: ["autoheal"]
    image: willfarrell/autoheal:latest@sha256:a4645c87683564c02154fbfb056eba3431cdb32b48c923359c3d55c4ec56ce89
    container_name: carpos-autoheal
    restart: unless-stopped
    # Bounded logs. The default json-file driver never rotates, and these logs
    # carry personal data: the broker records "client connected from <IP>" for
    # every device and the reverse proxy logs client IPs. An unbounded log is an
    # unbounded retention period for exactly the data nobody meant to keep. See
    # docs/PRIVACY.md.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      # How often to poll health, and how long to leave a freshly restarted
      # container alone before it is eligible to be restarted again.
      AUTOHEAL_INTERVAL: 15
      AUTOHEAL_START_PERIOD: 30
    volumes:
      # autoheal needs the Docker API to read health and issue restarts. Read-only,
      # but socket access is still effectively root on the host - that is the price
      # of unhealthy-restart. Drop this service if you would rather not pay it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Talks only to the socket; it needs no network at all.
    network_mode: none
    pids_limit: 32

volumes:
  mosquitto_data:
  mosquitto_secrets:

networks:
  # Created outside this stack, so both this and the Postgres stack just join it:
  #   docker network create MQTTpublic
  # `driver` cannot be combined with `external` - the network's settings belong to
  # whoever created it.
  MQTTpublic:
    name: MQTTpublic
    external: true
